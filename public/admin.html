<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-user-cog"></i> Eğitmen Paneli</h1>
            <button onclick="logout()" class="btn danger small">Çıkış Yap</button>
        </header>

        <!-- Quiz Listesi -->
        <div id="quizListSection" class="card">
            <div class="header-actions">
                <h2>Quizlerim</h2>
                <button onclick="showCreateQuizModal()" class="btn success"><i class="fas fa-plus"></i> Yeni
                    Quiz</button>
            </div>
            <div id="quizList" class="quiz-grid">
                <!-- Quizler buraya gelecek -->
                <p>Yükleniyor...</p>
            </div>
        </div>

        <!-- Quiz Oluşturma Modal -->
        <div id="createQuizModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('createQuizModal')">&times;</span>
                <h2>Yeni Quiz Oluştur</h2>
                <input type="text" id="newQuizTitle" placeholder="Quiz Başlığı">
                <textarea id="newQuizDesc" placeholder="Açıklama (İsteğe bağlı)"></textarea>
                <button onclick="createQuiz()" class="btn primary">Oluştur</button>
            </div>
        </div>

        <!-- Soru Ekleme / Detay Modal -->
        <div id="quizDetailModal" class="modal">
            <div class="modal-content large">
                <span class="close" onclick="closeModal('quizDetailModal')">&times;</span>
                <h2 id="detailTitle">Quiz Detayı</h2>
                <p id="detailCode" class="quiz-code-display"></p>

                <hr>

                <h3>Yeni Soru Ekle</h3>
                <div class="form-group">
                    <input type="text" id="qText" placeholder="Soru Metni">
                    <div class="options-grid">
                        <input type="text" id="optA" placeholder="Seçenek A">
                        <input type="text" id="optB" placeholder="Seçenek B">
                        <input type="text" id="optC" placeholder="Seçenek C">
                        <input type="text" id="optD" placeholder="Seçenek D">
                    </div>
                    <select id="correctOpt">
                        <option value="a">Doğru Cevap: A</option>
                        <option value="b">Doğru Cevap: B</option>
                        <option value="c">Doğru Cevap: C</option>
                        <option value="d">Doğru Cevap: D</option>
                    </select>
                    <input type="number" id="qPoints" value="10" placeholder="Puan">
                    <button onclick="addQuestion()" class="btn secondary">Soruyu Ekle</button>
                </div>

                <hr>

                <h3>Sonuçlar</h3>
                <div id="resultsList">
                    <!-- Sonuçlar buraya -->
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
